<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#164b3c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Indkøb"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="ikon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Indkøb</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f0;color:#193d31;font:16px system-ui,-apple-system,sans-serif}main,.login{max-width:660px;margin:auto;padding:20px 15px 70px}.hide{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:#668476}h1{margin:5px 0 16px;font-size:clamp(25px,6vw,35px);letter-spacing:-.04em}h2{font-size:17px;margin:0}.card{background:white;border:1px solid #e1e9e0;border-radius:18px;padding:17px;margin:13px 0;box-shadow:0 3px 16px #163d2b0b}input,button{font:inherit}input[type=email],input[type=password],input[type=text]{padding:13px;border:1px solid #cddbd0;border-radius:11px;min-width:0;width:100%;background:white}button{cursor:pointer}button:disabled{opacity:.5}.primary{border:0;border-radius:11px;background:#17533e;color:white;font-weight:700;padding:13px 16px}.soft{border:1px solid #d5e2d6;background:#f3f8f2;border-radius:10px;padding:8px 10px;color:#245941}.quiet{border:0;background:none;color:#527766;text-decoration:underline}.add{display:flex;gap:8px}.add input{flex:1}.item{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #edf1ec}.item:last-child{border:0}.item input[type=checkbox]{width:25px;height:25px;accent-color:#17533e;flex:none}.name{flex:1;overflow-wrap:anywhere;font-weight:600}.done .name{text-decoration:line-through;color:#9aaba0}.quantity{display:flex;align-items:center;gap:5px}.quantity button{border:1px solid #d8e4d9;background:#f5f8f4;border-radius:8px;width:30px;height:30px}.quantity span{min-width:18px;text-align:center}.delete{border:0;background:none;color:#a65b55;font-size:24px}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chips button{border:1px solid #d5e5d8;border-radius:25px;background:#f2f8f2;padding:7px 11px;color:#2b6047}.empty{padding:25px;text-align:center;color:#82978a}.muted{color:#7a9283;font-size:13px}.error{color:#b44841;font-size:13px;min-height:18px}.login{max-width:420px;padding-top:12vh}.login label{display:block;margin:13px 0 6px;font-weight:600}.login .primary{width:100%;margin-top:15px}body.dashboard{background:transparent}body.dashboard main{padding:5px;max-width:none}body.dashboard .card{margin:0;box-shadow:none;padding:12px}body.dashboard h1{font-size:19px;margin:0 0 8px}body.dashboard .item{padding:8px 0}body.dashboard .eyebrow,body.dashboard #logout,body.dashboard #addCard,body.dashboard #historyCard,body.dashboard #clear,body.dashboard .quantity button,body.dashboard .delete{display:none}body.dashboard .item input{pointer-events:none}body.dashboard .name{font-size:14px}
</style></head><body><section id="login" class="login hide"><div class="card"><div class="eyebrow">FAMILIEN DØSSING PAULSEN</div><h1>🛒 Familiens indkøb</h1><p>Log ind med samme bruger som i familiekalenderen.</p><form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Adgangskode</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">Log ind</button><p id="loginError" class="error"></p></form></div></section><main id="app" class="hide"><header class="top"><div><div class="eyebrow">FAMILIENS OVERBLIK</div><h1>🛒 Indkøbslisten</h1></div><button id="logout" class="quiet">Log ud</button></header><section class="card" id="addCard"><form id="addForm" class="add"><input id="newItem" type="text" maxlength="100" autocomplete="off" placeholder="Hvad mangler vi?" required><button class="primary">Tilføj</button></form><div id="suggestions" class="chips"></div></section><section class="card"><div class="between"><h2 id="count">Indkøb</h2><button id="clear" class="soft">Fjern afkrydsede</button></div><div id="items" class="empty">Henter varer …</div></section><section class="card" id="historyCard"><h2>Ofte købt</h2><div id="history" class="chips"></div></section><p id="status" class="error"></p><p class="muted" style="text-align:center">Fælles liste · Opdateres automatisk</p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://kxopqitccnoycjwpibuj.supabase.co','sb_publishable_J6Ez04iYCczh_FW8OOQnig_3zcGxeaI');
const $=id=>document.getElementById(id),dashboard=new URLSearchParams(location.search).get('mode')==='dashboard';if(dashboard)document.body.classList.add('dashboard');
let signed=false,items=[],history=[],busy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(ok){$('login').classList.toggle('hide',ok);$('app').classList.toggle('hide',!ok);if(ok&&!signed){signed=true;refresh()}if(!ok){signed=false;items=[];history=[]}}
async function refresh(){if(!signed||busy)return;const [a,b]=await Promise.all([db.from('indkoeb').select('id,vare,antal,afkrydset,oprettet_at').order('oprettet_at',{ascending:true}),db.from('indkoeb_historik').select('vare,sidst_brugt').order('sidst_brugt',{ascending:false}).limit(80)]);if(a.error){$('status').textContent='Kunne ikke hente varer: '+a.error.message;return}items=a.data||[];if(!b.error)history=b.data||[];render();$('status').textContent=''}
function render(){const active=items.filter(x=>!x.afkrydset),done=items.filter(x=>x.afkrydset);$('count').textContent=`Mangler ${active.length} ${active.length===1?'vare':'varer'}`;$('clear').disabled=!done.length;const rows=[...active,...done];$('items').className='';$('items').innerHTML=rows.length?rows.map(x=>`<div class="item ${x.afkrydset?'done':''}" data-id="${x.id}"><input type="checkbox" aria-label="Købt: ${esc(x.vare)}" ${x.afkrydset?'checked':''}><span class="name">${esc(x.vare)}</span><div class="quantity"><button data-action="minus" aria-label="Færre">−</button><span>${x.antal}</span><button data-action="plus" aria-label="Flere">+</button></div><button class="delete" data-action="delete" aria-label="Slet">×</button></div>`).join(''):'<div class="empty">Listen er tom 🎉</div>';const present=new Set(items.map(x=>x.vare.toLocaleLowerCase('da-DK')));$('history').innerHTML=history.filter(x=>!present.has(x.vare.toLocaleLowerCase('da-DK'))).slice(0,15).map(x=>`<button data-vare="${esc(x.vare)}">+ ${esc(x.vare)}</button>`).join('')||'<span class="muted">Tidligere varer dukker op her.</span>';suggest()}
function suggest(){const s=$('newItem').value.trim().toLocaleLowerCase('da-DK');$('suggestions').innerHTML=s?history.filter(x=>x.vare.toLocaleLowerCase('da-DK').includes(s)&&x.vare.toLocaleLowerCase('da-DK')!==s).slice(0,5).map(x=>`<button data-vare="${esc(x.vare)}">${esc(x.vare)}</button>`).join(''):''}
async function mutate(f){if(busy)return;busy=true;$('status').textContent='';try{await f()}catch(e){$('status').textContent=e.message||String(e)}finally{busy=false;await refresh()}}
async function add(v){v=String(v||'').trim().replace(/\s+/g,' ');if(!v)return;await mutate(async()=>{const x=items.find(x=>x.vare.toLocaleLowerCase('da-DK')===v.toLocaleLowerCase('da-DK'));const r=x?await db.from('indkoeb').update({antal:x.antal+1,afkrydset:false,opdateret_at:new Date().toISOString()}).eq('id',x.id):await db.from('indkoeb').insert({vare:v});if(r.error)throw r.error;const h=await db.from('indkoeb_historik').upsert({vare:x?.vare||v,sidst_brugt:new Date().toISOString()},{onConflict:'vare'});if(h.error)console.warn(h.error);$('newItem').value=''})}
$('addForm').addEventListener('submit',e=>{e.preventDefault();add($('newItem').value)});$('newItem').addEventListener('input',suggest);for(const id of ['history','suggestions'])$(id).addEventListener('click',e=>{const b=e.target.closest('[data-vare]');if(b)add(b.dataset.vare)});
$('items').addEventListener('change',e=>{if(dashboard||e.target.type!=='checkbox')return;const id=Number(e.target.closest('[data-id]').dataset.id),checked=e.target.checked;mutate(async()=>{const r=await db.from('indkoeb').update({afkrydset:checked,opdateret_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error})});
$('items').addEventListener('click',e=>{if(dashboard)return;const b=e.target.closest('[data-action]');if(!b)return;const id=Number(b.closest('[data-id]').dataset.id),x=items.find(x=>x.id===id);if(!x)return;const action=b.dataset.action;if(action==='delete'&&!confirm(`Slet ${x.vare}?`))return;mutate(async()=>{const r=action==='delete'?await db.from('indkoeb').delete().eq('id',id):await db.from('indkoeb').update({antal:Math.max(1,x.antal+(action==='plus'?1:-1)),opdateret_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error})});
$('clear').addEventListener('click',()=>{const n=items.filter(x=>x.afkrydset).length;if(!n||!confirm(`Fjern ${n} afkrydsede varer?`))return;mutate(async()=>{const r=await db.from('indkoeb').delete().eq('afkrydset',true);if(r.error)throw r.error})});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)$('loginError').textContent='Login mislykkedes: '+error.message});$('logout').addEventListener('click',()=>db.auth.signOut());
(async()=>{const {data:{session}}=await db.auth.getSession();show(!!session);db.auth.onAuthStateChange((_event,session)=>show(!!session))})();setInterval(()=>{if(signed&&!document.hidden)refresh()},10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&signed)refresh()});
</script></body></html>
